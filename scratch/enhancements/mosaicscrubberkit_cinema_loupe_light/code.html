<!-- Interactive Layer Script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const loupe = document.getElementById('cinema-loupe');
            if (e.clientY > window.innerHeight - 300) {
                const xPos = e.clientX;
                const percentage = (xPos / window.innerWidth) * 100;
                loupe.style.left = `${percentage}%`;
                loupe.style.opacity = '1';
                loupe.style.transform = 'translateY(0)';
            } else {
                loupe.style.opacity = '0';
                loupe.style.transform = 'translateY(20px)';
            }
        });

        // Initialize micro-interactions
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Haptic feedback simulation
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });
    </script>
